name: Build packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        required: true
        default: all
        type: choice
        options:
          - all
          - netshift
          - luci-app-netshift

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="0.$(date +%d%m%Y)-${GITHUB_SHA::7}"
          else
            VERSION="0.$(date +%d%m%Y)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-ipk:
    name: Build IPK (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: netshift
            dockerfile: Dockerfile-ipk-netshift
            artifact_glob: netshift-*.ipk
          - target: luci-app-netshift
            dockerfile: Dockerfile-ipk-luci
            artifact_glob: "luci-app-netshift-*.ipk luci-i18n-netshift-ru-*.ipk"
          - target: all
            dockerfile: Dockerfile-ipk
            artifact_glob: "netshift-*.ipk luci-app-netshift-*.ipk luci-i18n-netshift-ru-*.ipk"
    steps:
      - name: Skip unrelated matrix rows
        id: filter
        run: |
          WANT="${{ github.event.inputs.package || 'all' }}"
          if [ "$WANT" != "all" ] && [ "$WANT" != "${{ matrix.target }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5.0.0
        if: steps.filter.outputs.skip == 'false'

      - name: Build IPK image (${{ matrix.target }})
        if: steps.filter.outputs.skip == 'false'
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./${{ matrix.dockerfile }}
          context: .
          tags: netshift:ci-ipk-${{ matrix.target }}
          load: true
          build-args: |
            NETSHIFT_VERSION=${{ needs.preparation.outputs.version }}

      - name: Extract packages
        if: steps.filter.outputs.skip == 'false'
        run: |
          CID=$(docker create netshift:ci-ipk-${{ matrix.target }})
          mkdir -p "./artifacts/${{ matrix.target }}"
          docker cp "$CID:/builder/bin/packages/x86_64/utilities/." "./artifacts/${{ matrix.target }}/" || true
          docker cp "$CID:/builder/bin/packages/x86_64/luci/." "./artifacts/${{ matrix.target }}/" || true
          docker rm "$CID"
          for f in ./artifacts/${{ matrix.target }}/*.ipk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed 's/_/-/g')
            mv "$f" "./artifacts/${{ matrix.target }}/$newname"
          done
          ls -la "./artifacts/${{ matrix.target }}/"

      - name: Upload IPK artifacts (${{ matrix.target }})
        if: steps.filter.outputs.skip == 'false'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ipk-${{ matrix.target }}-${{ needs.preparation.outputs.version }}
          path: ./artifacts/${{ matrix.target }}/*.ipk
          if-no-files-found: error
          retention-days: 14

  build-apk:
    name: Build APK (all)
    runs-on: ubuntu-latest
    needs: preparation
    if: github.event.inputs.package == 'all' || github.event.inputs.package == '' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Build APK image
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile-apk
          context: .
          tags: netshift:ci-apk
          load: true
          build-args: |
            NETSHIFT_VERSION=${{ needs.preparation.outputs.version }}

      - name: Extract packages
        run: |
          CID=$(docker create netshift:ci-apk)
          mkdir -p ./artifacts/apk
          docker cp "$CID:/builder/bin/packages/x86_64/utilities/." ./artifacts/apk/ || true
          docker cp "$CID:/builder/bin/packages/x86_64/luci/." ./artifacts/apk/ || true
          docker rm "$CID"
          ls -la ./artifacts/apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: apk-all-${{ needs.preparation.outputs.version }}
          path: ./artifacts/apk/*
          if-no-files-found: error
          retention-days: 14
