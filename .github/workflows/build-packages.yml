name: Build packages

on:
  push:
    branches:
      - main
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'fe-app-netshift/**'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
      - id: version
        run: |
          VERSION="0.$(date +%d%m%Y).${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: OpenWrt ${{ matrix.openwrt_version }} (${{ matrix.package_format }})
    runs-on: ubuntu-24.04
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: '24.10'
            package_format: ipk
            dockerfile: Dockerfile-ipk
          - openwrt_version: '25.12'
            package_format: apk
            dockerfile: Dockerfile-apk
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Build ${{ matrix.package_format }} image
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./${{ matrix.dockerfile }}
          context: .
          tags: netshift:ci-${{ matrix.package_format }}
          load: true
          build-args: |
            NETSHIFT_VERSION=${{ needs.preparation.outputs.version }}

      - name: Extract packages
        run: |
          mkdir -p "./artifacts/${{ matrix.package_format }}"
          CID=$(docker create "netshift:ci-${{ matrix.package_format }}")
          docker cp "$CID:/builder/bin/packages/x86_64/utilities/." "./artifacts/${{ matrix.package_format }}/" || true
          docker cp "$CID:/builder/bin/packages/x86_64/luci/." "./artifacts/${{ matrix.package_format }}/" || true
          docker rm "$CID"

          if [ "${{ matrix.package_format }}" = "ipk" ]; then
            for f in "./artifacts/${{ matrix.package_format }}"/*.ipk; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              newname=$(echo "$base" | sed 's/_/-/g')
              mv "$f" "./artifacts/${{ matrix.package_format }}/$newname"
            done
          fi

          ls -la "./artifacts/${{ matrix.package_format }}/"

      - name: Filter release packages
        run: |
          PKG_FMT="${{ matrix.package_format }}"
          mkdir -p "./filtered-bin/${PKG_FMT}"

          cp "./artifacts/${PKG_FMT}/luci-i18n-netshift-ru-"*".${PKG_FMT}" "./filtered-bin/${PKG_FMT}/"
          cp "./artifacts/${PKG_FMT}/netshift-"*".${PKG_FMT}" "./filtered-bin/${PKG_FMT}/"
          cp "./artifacts/${PKG_FMT}/luci-app-netshift-"*".${PKG_FMT}" "./filtered-bin/${PKG_FMT}/"

          ls -la "./filtered-bin/${PKG_FMT}/"

      - name: Upload ${{ matrix.package_format }} artifacts (OpenWrt ${{ matrix.openwrt_version }})
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openwrt-${{ matrix.openwrt_version }}-${{ matrix.package_format }}-${{ needs.preparation.outputs.version }}
          path: ./filtered-bin/${{ matrix.package_format }}/*.${{ matrix.package_format }}
          if-no-files-found: error
          retention-days: 14
