name: CI (main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (backend)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5.5.5
        with:
          severity: error
          include-path: |
            netshift/files/usr/bin/netshift
            netshift/files/usr/lib/**.sh
            install.sh
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke-tests:
    name: OpenWrt smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build OpenWrt smoke test image
        run: docker compose -f tests/docker-compose.yml build netshift-test

      - name: Run OpenWrt smoke tests
        run: docker compose -f tests/docker-compose.yml run --rm netshift-test all

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: openwrt-smoke-test-results
          path: tests/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend-ci:
    name: Frontend (fe-app-netshift)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-netshift
    steps:
      - uses: actions/checkout@v5.0.0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4.3.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('fe-app-netshift/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: yarn ci
        run: yarn ci
