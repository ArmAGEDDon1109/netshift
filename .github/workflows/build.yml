name: Release packages

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 0.9.9)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  smoke-tests:
    name: OpenWrt rootfs smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build OpenWrt smoke test image
        uses: docker/build-push-action@v7.4.0
        with:
          file: ./tests/Dockerfile
          context: .
          tags: netshift-evolution:test
          build-args: NETSHIFT_VERSION=test
          load: true
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,mode=max,scope=smoke

      - name: Run OpenWrt smoke tests
        run: docker compose -f tests/docker-compose.yml run --rm netshift-test all

  preparation:
    name: Setup build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.$(date +%d%m%Y)")
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: OpenWrt ${{ matrix.openwrt_version }} (${{ matrix.package_type }})
    runs-on: ubuntu-24.04
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_type: ipk
            openwrt_version: '24.10'
            dockerfile: Dockerfile-ipk
          - package_type: apk
            openwrt_version: '25.12'
            dockerfile: Dockerfile-apk
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build ${{ matrix.package_type }} (OpenWrt ${{ matrix.openwrt_version }})
        uses: docker/build-push-action@v7.4.0
        with:
          file: ./${{ matrix.dockerfile }}
          context: .
          tags: netshift:ci-${{ matrix.package_type }}
          load: true
          cache-from: type=gha,scope=${{ matrix.package_type }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package_type }}
          build-args: |
            NETSHIFT_VERSION=${{ needs.preparation.outputs.version }}

      - name: Create ${{ matrix.package_type }} Docker container
        run: docker create --name ${{ matrix.package_type }}-${{ matrix.openwrt_version }} netshift:ci-${{ matrix.package_type }}

      - name: Copy files from ${{ matrix.package_type }} Docker container
        run: |
          mkdir -p ./bin/${{ matrix.package_type }}
          docker cp ${{ matrix.package_type }}-${{ matrix.openwrt_version }}:/builder/bin/packages/x86_64/utilities/. ./bin/${{ matrix.package_type }}/
          docker cp ${{ matrix.package_type }}-${{ matrix.openwrt_version }}:/builder/bin/packages/x86_64/luci/. ./bin/${{ matrix.package_type }}/

        # IPK uses underscore `_` in filenames, while APK uses only dash `-`
      - name: Fix naming difference between build for packages (replace _ with -)
        if: matrix.package_type == 'ipk'
        shell: bash
        run: |
          for f in ./bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed 's/_/-/g')
            [ "$base" = "$newname" ] && continue
            mv "$f" "./bin/${{ matrix.package_type }}/$newname"
          done

      - name: Filter files
        shell: bash
        run: |
          # Use version from preparation job (already without 'v' prefix)
          VERSION="${{ needs.preparation.outputs.version }}"

          mkdir -p ./filtered-bin/${{ matrix.package_type }}
          ext="${{ matrix.package_type }}"
          shopt -s nullglob
          i18n=(./bin/${{ matrix.package_type }}/luci-i18n-netshift-ru-*."${ext}")
          if [ ${#i18n[@]} -eq 0 ]; then
            echo "luci-i18n-netshift-ru package not found in ./bin/${{ matrix.package_type }}/"
            ls -la "./bin/${{ matrix.package_type }}/" || true
            exit 1
          fi
          i18n_copied=
          for f in "${i18n[@]}"; do
            case "$(basename "$f")" in
              *"${VERSION}"*)
                cp "$f" "./filtered-bin/${{ matrix.package_type }}/luci-i18n-netshift-ru-${VERSION}.${ext}"
                i18n_copied=1
                break
                ;;
            esac
          done
          if [ -z "$i18n_copied" ]; then
            echo "luci-i18n-netshift-ru package matching version ${VERSION} not found"
            ls -la "./bin/${{ matrix.package_type }}/" || true
            exit 1
          fi
          shopt -s nullglob
          netshift_pkgs=(./bin/${{ matrix.package_type }}/netshift-"${VERSION}"-*."${ext}")
          luci_pkgs=(./bin/${{ matrix.package_type }}/luci-app-netshift-"${VERSION}"-*."${ext}")
          if [ ${#netshift_pkgs[@]} -eq 0 ] || [ ${#luci_pkgs[@]} -eq 0 ]; then
            echo "Versioned packages for ${VERSION} not found in ./bin/${{ matrix.package_type }}/"
            ls -la "./bin/${{ matrix.package_type }}/" || true
            exit 1
          fi
          cp "${netshift_pkgs[@]}" ./filtered-bin/${{ matrix.package_type }}/
          cp "${luci_pkgs[@]}" ./filtered-bin/${{ matrix.package_type }}/

      - name: Remove Docker container
        run: docker rm ${{ matrix.package_type }}-${{ matrix.openwrt_version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-files-${{ github.run_id }}-${{ matrix.package_type }}
          path: ./filtered-bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs:
      - preparation
      - smoke-tests
      - build
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Create release dir
        run: |
          mkdir -p ./filtered-bin/release/openwrt-24.10 ./filtered-bin/release/openwrt-25.12

      - name: Download ipk artifacts (OpenWrt 24.10)
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-files-${{ github.run_id }}-ipk
          path: ./filtered-bin/release/openwrt-24.10

      - name: Download apk artifacts (OpenWrt 25.12)
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-files-${{ github.run_id }}-apk
          path: ./filtered-bin/release/openwrt-25.12

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            ./filtered-bin/release/openwrt-24.10/*
            ./filtered-bin/release/openwrt-25.12/*
          draft: false
          prerelease: false
          name: ${{ needs.preparation.outputs.version }}
          tag_name: ${{ needs.preparation.outputs.version }}
          generate_release_notes: true
          body: |
            ## Пакеты

            | OpenWrt | Формат | Каталог в релизе |
            | --- | --- | --- |
            | **24.10.x** | `.ipk` (opkg) | `openwrt-24.10/` |
            | **25.12.x** | `.apk` (apk) | `openwrt-25.12/` |

            В каждой папке три файла: `netshift`, `luci-app-netshift`, `luci-i18n-netshift-ru`.

            ### Установка с роутера

            ```sh
            sh -c "$(wget -O - https://raw.githubusercontent.com/ArmAGEDDon1109/netshift/refs/heads/main/install.sh)"
            ```

            Скрипт сам выберет `.ipk` или `.apk` по установленному менеджеру пакетов.